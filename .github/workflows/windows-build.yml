name: Windows Double & Single Precision Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  # vcpkg master of 27 Oct 2026 (866e9e2): its msys2 runtime (3.4.10-5) is on repo.msys2.org (HTTP 200);
  # the pinned default asked for 3.5.4-2, which is gone (404). See CesiumBuildUtils.py.
  EZVCPKG_COMMIT: "866e9e258a76437074a5cf02d4c2d71b53bff2f8"

jobs:
  double:
    name: Build Godot3DTiles Extension (Double Precision)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    - name: Build Extension (Double Precision Debug)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=double

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-double-precision-dev
        path: godot3dtiles/

  single:
    # Fork (hcIfU, 28 Oct 2026): the single-precision job no longer waits on the double one - the maker's 5 Aug 2026
    # master run failed in the double link (LNK1181 Cesium3DTilesSelection.lib) and skipped single. Single is the binary we run.
    name: Build Godot3DTiles Extension (Single Precision)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    - name: Build Extension (Single Precision Debug)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-single-precision-dev
        path: godot3dtiles/
